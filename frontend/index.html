<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/index.css" />
    <title>AquaMar</title>
  </head>

  <body class="bg-[#031421] text-white">
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
    </div>

    <svg style="display: none">
      <filter id="liquid-distortion">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.015"
          numOctaves="2"
          result="noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="15"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>

    <header class="fixed top-0 left-0 w-full z-50 px-6 py-4">
      <nav
        class="glass max-w-7xl mx-auto rounded-full px-6 py-4 flex items-center justify-between"
      >
        <a class="font-bold text-2xl" href="">AquaMar</a>

        <div class="hidden md:flex items-center gap-8 text-sm">
          <a
            class="transition duration-300 hover:scale-105 hover:shadow-lg shadow-[#130B41]"
            href=""
            ><i data-lucide="home"></i
          ></a>
          <a
            class="transition duration-300 hover:scale-105 hover:shadow-lg shadow-[#130B41]"
            href=""
            ><i data-lucide="calendar-days"></i
          ></a>
          <a
            class="transition duration-300 hover:scale-105 hover:shadow-lg shadow-[#130B41]"
            href=""
            ><i data-lucide="fish"></i
          ></a>
          <a
            class="transition duration-300 hover:scale-105 hover:shadow-lg shadow-[#130B41]"
            href=""
            ><i data-lucide="map"></i
          ></a>
        </div>
      </nav>
    </header>

    <main>
      <section
        class="flex items-center justify-center px-6 min-h-screen relative"
      >
        <div
          class="absolute inset-0 bg-gradient-to-b from-cyan-500/10 to-transparent"
        ></div>

        <div class="max-w-4xl text-center relative z-10">
          <div class="glass rounded-full px-5 py-1 inline-block md:mt-10">
            <p class="uppercase tracking-[0.3em] text-sky-400 text-base">
              Experiência Aquática
            </p>
          </div>

          <h1 class="text-4xl md:text-7xl font-bold leading-tight mt-5">
            Explore o
            <span class="text-sky-400">Universo Marinho</span>
          </h1>

          <p
            class="text-white/70 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed mb-10"
          >
            Explore espécies marinhas incríveis, apresentações especiais e
            experiências únicas no AquaMar.
          </p>

          <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a
              class="bg-cyan-400 text-slate-900 px-8 py-4 rounded-full font-bold transition duration-300 hover:scale-105"
              href=""
            >
              Explorar Agora
            </a>

            <a
              class="glass px-8 py-4 rounded-full font-semibold transition duration-300 hover:scale-105"
              href=""
            >
              Ver Cronograma
            </a>
          </div>
        </div>
      </section>

      <section
        class="flex items-center justify-center px-6 min-h-screen relative"
      >
        <div
          class="w-full max-w-6xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"
        >
          <div class="glass rounded-3xl p-8 text-center w-full">
            <h2 class="text-4xl font-bold text-cyan-300 mb-2">25+</h2>
            <p class="text-white/70">Espécies Marinhas</p>
          </div>

          <div class="glass rounded-3xl p-8 text-center w-full">
            <h2 class="text-4xl font-bold text-cyan-300 mb-2">8</h2>
            <p class="text-white/70">Áreas Oceânicas</p>
          </div>

          <div class="glass rounded-3xl p-8 text-center w-full">
            <h2 class="text-4xl font-bold text-cyan-300 mb-2">12</h2>
            <p class="text-white/70">Apresentações Diárias</p>
          </div>

          <div class="glass rounded-3xl p-8 text-center w-full">
            <h2 class="text-4xl font-bold text-cyan-300 mb-2">Live</h2>
            <p class="text-white/70">Mapa Interativo</p>
          </div>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
