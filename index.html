<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="shortcut icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/index.css" />
  <title>AquaMar</title>
</head>

<body class="bg-[#031421] text-white overflow-x-hidden">
  <!-- <audio autoPlay loop>
    <source id="animal-audio" src="sons/bubbles.mp3" type="audio/mp3">
  </audio> -->

  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <svg style="display: none">
    <filter id="liquid-distortion">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <header class="fixed top-0 left-0 w-full z-50 px-6 py-4">
    <nav class="glass max-w-7xl mx-auto rounded-full px-8 py-5 flex items-center justify-between">
      <a class="font-bold text-3xl" href="">AquaMar</a>
      <div class="hidden md:flex items-center gap-10 text-base">
        <a class="transition duration-300 hover:scale-105" href=""><i data-lucide="home"></i></a>
        <a class="transition duration-300 hover:scale-105" href=""><i data-lucide="calendar-days"></i></a>
        <a class="transition duration-300 hover:scale-105" href=""><i data-lucide="fish"></i></a>
        <a class="transition duration-300 hover:scale-105" href=""><i data-lucide="map"></i></a>
      </div>
    </nav>
  </header>

  <main>
    <div class="absolute inset-0 bg-gradient-to-b from-cyan-500/10 to-transparent"></div>
    <section
      class="relative grid grid-cols-1 md:grid-cols-2 items-center min-h-screen px-8 md:px-8 pt-36 pb-20 max-w-7xl mx-auto gap-20">

      <div class="relative z-10 flex flex-col gap-6 items-center text-center md:items-start md:text-left">
        <div class="glass rounded-full px-5 py-1.5 inline-flex items-center gap-2 w-fit">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
          <p class="uppercase tracking-[0.3em] text-sky-400 text-sm">Experiência Aquática</p>
        </div>

        <h1 class="text-4xl md:text-6xl font-bold leading-tight">
          Explore o
          <span class="text-sky-400">Universo Marinho</span>
        </h1>

        <p class="text-white/60 text-lg max-w-md leading-relaxed">
          Explore espécies marinhas incríveis, apresentações especiais e
          experiências únicas no AquaMar.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 mt-2 w-full sm:w-auto">
          <a class="bg-cyan-400 text-slate-900 px-8 py-4 rounded-full font-bold transition duration-300 hover:scale-105 hover:bg-cyan-300 text-center w-full sm:w-auto"
            href="">
            Explorar Agora
          </a>
          <a class="glass px-8 py-4 rounded-full font-semibold transition duration-300 hover:scale-105 text-center w-full sm:w-auto"
            href="">
            Ver Cronograma
          </a>
        </div>
      </div>

      <div class="hidden md:flex items-center justify-center">
        <img src="images/logo.png" alt="AquaMar" class="logo-float w-95 h-95 object-contain" />
      </div>

    </section>
    <section
      class="glass rounded-3xl grid grid-cols-1 md:grid-cols-2 items-center px-6 md:px-10 py-10 md:py-12 max-w-7xl mx-5 md:mx-auto gap-8 md:gap-16 my-20">

      <div class="flex items-center justify-center">
        <div class="relative">

          <div class="absolute inset-0 rounded-3xl bg-cyan-400/10 blur-2xl"></div>

          <img id="animal-img"
            class="relative w-56 h-56 md:w-80 md:h-80 object-cover rounded-3xl border border-white/10 transition-all duration-500"
            src="" alt="Animal">

        </div>
      </div>

      <div class="flex flex-col gap-6 text-center md:text-left items-center md:items-start">

        <div class="flex flex-col gap-4">
          <span class="glass rounded-full px-4 py-1 text-sky-400 text-xs uppercase tracking-widest w-fit">
            Animal em destaque
          </span>

          <h2 id="animal-name" class="text-3xl md:text-4xl font-bold"></h2>
        </div>

        <p id="animal-desc" class="text-white/60 text-base leading-relaxed">
        </p>
        <div class="border-t border-white/10 w-full"></div>

        <ul id="animal-facts" class="flex flex-col gap-4 w-full">

          <li class="flex items-center gap-2">
            <i data-lucide="trees" class="w-5 h-5 text-cyan-400 shrink-0"></i>

            <span class="text-white/70 text-sm">
              <strong class="text-white">Habitat:</strong>
              <span id="animal-habitat"></span>
            </span>
          </li>

          <li class="flex items-center gap-2">
            <i data-lucide="ruler" class="w-5 h-5 text-cyan-400 shrink-0"></i>

            <span class="text-white/70 text-sm">
              <strong class="text-white">Tamanho:</strong>
              <span id="animal-size"></span>
            </span>
          </li>

          <li class="flex items-center gap-2">
            <i data-lucide="badge-alert" class="w-5 h-5 text-cyan-400 shrink-0"></i>

            <span class="text-white/70 text-sm">
              <strong class="text-white">Status:</strong>
              <span id="animal-status"></span>
            </span>
          </li>

        </ul>

      </div>

    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="js/index.js"></script>
</body>

</html>
